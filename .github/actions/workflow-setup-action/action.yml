name: 'workflow-setup-action'
description: 'Composite action for workflow setup'
inputs:
  packageManager:
    required: false
    description: "using yarn or lerna for dependency management"
    default: "yarn3"
  nodeVersion:
    required: false
    description: "what node version to install"
    default: ""
  nodeVersionFile:
    required: false
    description: "file to read nodeVersion from"
    default: ""
  vulnerabilityToken:
    required: false
    description: "token used for vulnerability checking"
    default: ""
  vulnerabilityLevel:
    required: false
    description: "Override CRITICAL level for failure on vulnerability check.  HIGH, MODERATE or LOW."
    default: "CRITICAL"
  vulnerabilityFail:
    required: false
    description: "Override failure on found vulnerabilities"
    default: "false"
  ref:
    required: false
    description: "ref to checkout"
    default: ""
  fetch-depth:
    required: false
    description: "checkout fetch-depth"
    default: "1"
  path:
    required: false
    description: "Relative path under $GITHUB_WORKSPACE to place the repository"
    default: "./"
  clean:
    required: false
    description: "Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching"
    default: "true"
  setup_ruby:
    description: "Whether or not to execute ruby setup action"
    default: "false"
    required: false
  ruby_version:
    description: "Desired version of Ruby"
    default: "2.7"
    required: false
  ruby_bundler_cache:
    description: "Enable Ruby bundler-cache"
    default: "false"
    required: false
  repository:
    description: "What repository to checkout"
    default: ${{ github.repository }}
    required: false
  checkoutToken:
    description: "Specific token for checkout, if checking out a different repository"
    default: ${{ github.token }}
    required: false
  cacheDependencyPath:
    description: "Used to specify the path to a dependency file: package-lock.json, yarn.lock, etc."
    default: ""
    required: false
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        token: ${{ inputs.checkoutToken }}
        repository: ${{ inputs.repository }}
    - name: set package manager
      id: set-pm
      run: |
        pm="${INPUT//[^[:alpha:]]/}"
        echo "package manager is ${pm}"
        echo "packageManager=${INPUT//[^[:alpha:]]/}" >> "$GITHUB_OUTPUT"
      env:
        INPUT: ${{ inputs.packageManager }}
      shell: bash
    - name: Setup Node
      id: setup-node
      uses: actions/setup-node@v7
      with:
        cache: ${{ steps.set-pm.outputs.packageManager }}
        cache-dependency-path: ${{ inputs.cacheDependencyPath }}
        node-version: ${{ inputs.nodeVersion }}
        node-version-file: ${{ inputs.nodeVersionFile }}
    - name: Setup Ruby
      id: setup-ruby
      uses: ruby/setup-ruby@v1
      if: inputs.setup_ruby == 'true'
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: ${{ inputs.ruby_bundler_cache }}
    - name: yarn v1 install
      id: yarn-install
      if: inputs.packageManager == 'yarn'
      run: |
        echo "::group::Yarn Install"
        yarn --cwd "${{ inputs.path }}" install --frozen-lockfile
        echo "::endgroup::"
      shell: bash
    - name: yarn v3/v4 install
      id: yarn3-install
      if: inputs.packageManager == 'yarn3' || inputs.packageManager == 'yarn4'
      run: |
        echo "::group::Yarn Install"
        cd "${{ inputs.path }}" && yarn install --immutable
        echo "::endgroup::"
      shell: bash
