name: Sync Labels
on:
  workflow_call:
    inputs:
      runsOn:
        description: "Runner to use.  Default is 'ubuntu-latest'"
        required: false
        type: string
        default: "ubuntu-latest"
      timeoutMinutes:
        description: "Timeout in minutes"
        required: false
        type: string
        default: "3"
jobs:
  sync:
    name: Sync Labels
    runs-on: ${{ inputs.runsOn }}
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync Labels
        uses: b4b4r07/github-labeler@master
        id: labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
