name: Package Publish
on:
  workflow_call:
    inputs:
      runsOn:
        description: "Runner to use.  Default is 'ubuntu-latest'"
        required: false
        type: string
        default: "ubuntu-latest"
      access:
        description: "The access for the published package (public or restricted)"
        required: false
        type: string
        default: "public"
      timeoutMinutes:
        description: "Timeout in minutes"
        required: false
        type: string
        default: "10"
      githubEventName:
        required: false
        type: string
        default: ${{ github.event_name }}
      fetchDepth:
        description: "Checkout fetch depth"
        required: false
        type: string
        default: "0"
      packageManager:
        description: "Package manager to use.  yarn3 vs yarn"
        required: false
        type: string
        default: "yarn3"
      npmjsPublishToken:
        description: "NPMJS token with publishing permissions"
        required: false
        type: string
        default: "NPM_TOKEN_PUBLISH"
      nodeVersion:
        description: "Version of Node to use"
        required: false
        type: string
        default: ""
      nodeVersionFile:
        description: "file to read nodeVersion from"
        required: false
        type: string
        default: ".nvmrc"
      workspaces:
        description: "are workspaces enabled?  should this run for all workspaces?"
        required: false
        type: string
        default: "false"
      workspace:
        description: "specific workspoace to run against"
        required: false
        type: string
        default: ""
permissions:
  id-token: write  # CRITICAL: Allows the workflow to request the OIDC JWT
  contents: read   # Standard checkout permission
jobs:
  prerelease:
    name: Publish Prerelease
    runs-on: ${{ inputs.runsOn }}
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Setup
        uses: CumulusDS/workflows-public/.github/actions/workflow-setup-action@master
        with:
          nodeVersion: ${{ inputs.nodeVersion }}
          nodeVersionFile: ${{ inputs.nodeVersionFile }}
          fetch-depth: ${{ inputs.fetchDepth }}
          packageManager: ${{ inputs.packageManager }}
      - name: Set feature stage
        id: feature
        uses: CumulusDS/workflows-public/.github/actions/feature-stage-action@master
        with:
          githubEventName: ${{ inputs.githubEventName }}
      - name: set node publish token
        if: ${{ inputs.npmjsPublishToken != '' }}
        uses: CumulusDS/workflows-public/.github/actions/set-publish-token@master
        with:
          packageManager: ${{ inputs.packageManager }}
          npmjsPublishToken: ${{ secrets[inputs.npmjsPublishToken] }}
      # set prerelease version
      - name: Set prerelease version (packages/hybrid)
        if: inputs.workspaces != 'true' && inputs.workspace == ''
        run: yarn run prerelease ${{ steps.feature.outputs.stage }}
      - name: Set prerelease version (all workspaces)
        if: inputs.workspaces == 'true' && inputs.workspace == ''
        run: |
          if [[ "${{ inputs.packageManager }}" == "yarn3" ]]; then
            echo "::debug::setting prerelease version for yarn v3"
            yarn workspaces foreach --no-private run prerelease ${{ steps.feature.outputs.stage }}
          elif [[ "${{ inputs.packageManager }}" == "yarn4" ]]; then
            echo "::debug::setting prerelease version for yarn v4"
            yarn workspaces foreach --all --topological-dev --no-private run prerelease ${{ steps.feature.outputs.stage }}
          else
            echo "unknown package manager"
            exit 1
          fi
      - name: Set prerelease version ${{ inputs.workspace }}
        if: inputs.workspaces != 'true' && inputs.workspace != ''
        run: yarn workspace ${{ inputs.workspace }} run prerelease ${{ steps.feature.outputs.stage }}
      # publish
      - name: Publish (packages/hybrid)
        if: inputs.workspaces != 'true' && inputs.workspace == ''
        run: yarn npm publish --tag ${{ steps.feature.outputs.stage }}
      - name: Publish (all workspaces)
        if: inputs.workspaces == 'true' && inputs.workspace == ''
        run: |
          echo "::group::Build"
          yarn build
          echo "::endgroup::"
          if [[ "${{ inputs.packageManager }}" == "yarn3" ]]; then
            echo "::debug::setting prerelease version for yarn v3"
            yarn workspaces foreach --no-private npm publish --tag ${{ steps.feature.outputs.stage }}
          elif [[ "${{ inputs.packageManager }}" == "yarn4" ]]; then
            echo "::debug::setting prerelease version for yarn v4"
            yarn workspaces foreach --worktree --topological-dev --no-private run publish --tag ${{ steps.feature.outputs.stage }}
          else
            echo "unknown package manager"
            exit 1
          fi
      - name: Publish ${{ inputs.workspace }}
        if: inputs.workspaces != 'true' && inputs.workspace != ''
        run: yarn workspace ${{ inputs.workspace }} run publish --tag ${{ steps.feature.outputs.stage }}
      # $GITHUB_STEP_SUMMARY
      - name: Summary (packages/hybrid)
        if: inputs.workspaces != 'true' && inputs.workspace == ''
        run: echo "### Published $(jq '.name' package.json) version $(jq .version package.json) to NPM" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary (all workspaces)
        if: inputs.workspaces == 'true' && inputs.workspace == ''
        run: |
          pjs=($(find . -type f -name package.json -not -path "./node_modules/*"))
          echo "package.json files found: ${pjs[@]}"
          for version in "${pjs[@]}"; do
            if [[ "$(jq -r '.private' ${version})" != "true" ]]; then
              echo "### Published $(jq '.name' ${version}) version $(jq '.version' ${version}) to NPM" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Summary ${{ inputs.workspace }}
        if: inputs.workspaces != 'true' && inputs.workspace != ''
        run: |
          pjs=($(find . -type f -name package.json -not -path "./node_modules/*"))
          echo "package.json files found: ${pjs[@]}"

          for version in "${pjs[@]}"; do
            if [[ "$(jq -r '.name' ${version})" == "${{ inputs.workspace }}" ]]; then
              echo "### Published $(jq '.name' ${version}) version $(jq '.version' ${version}) to NPM" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
